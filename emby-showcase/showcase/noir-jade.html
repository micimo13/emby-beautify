<!DOCTYPE html><html><head><meta charset="utf-8"><style>
:root {
  --bg-h:160; --bg-s:30%; --bg-l:6%;
  --ph:150; --ps:80%; --pl:45%;
  --bg: hsl(var(--bg-h),var(--bg-s),var(--bg-l));
  --bg2: hsl(var(--bg-h),var(--bg-s),calc(var(--bg-l) + 8%));
  --card: hsla(var(--bg-h),var(--bg-s),calc(var(--bg-l) + 12%),.75);
  --accent: hsl(var(--ph),var(--ps),var(--pl));
  --line: hsla(var(--bg-h),var(--bg-s),80%,.12);
  --txt: hsla(var(--bg-h),var(--bg-s),92%,.92);
  --txt2: hsla(var(--bg-h),var(--bg-s),92%,.55);
}
* {margin:0;padding:0;box-sizing:border-box}
body {background:var(--bg);color:var(--txt);font-family:'HarmonyOS Sans SC','PingFang SC',sans-serif;min-height:100vh}
.drawer {position:fixed;left:0;top:0;bottom:0;width:216px;background:hsla(var(--bg-h),var(--bg-s),calc(var(--bg-l)+4%),.9);backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:22px 14px;z-index:40}
.brand {font-size:17px;font-weight:900;letter-spacing:2px;padding:0 12px 20px;color:#fff}
.brand i {color:var(--accent);font-style:normal}
.nav-it {display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;margin:2px 0;font-size:13.5px;cursor:pointer;color:var(--txt2)}
.nav-it .ic {font-size:16px;width:22px;text-align:center}
.nav-it:hover {background:var(--card);color:var(--txt)}
.nav-it.sel {background:hsla(var(--ph),var(--ps),var(--pl),.15);color:var(--accent);font-weight:600}
.nav-it.sel .ic {color:var(--accent)}
.nav-sec {font-size:10px;letter-spacing:2px;color:var(--txt2);opacity:.6;padding:16px 12px 6px;text-transform:uppercase}
.topbar {position:fixed;top:0;left:216px;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 28px;background:linear-gradient(180deg,var(--bg),transparent);z-index:30}
.search {flex:1;max-width:400px}
.search input {width:100%;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;outline:none}
.search input:focus {border-color:var(--accent)}
.hbtn {width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--txt2);font-size:15px;cursor:pointer}
.hbtn:hover {background:var(--card);color:var(--txt)}
.avatar {width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#e8a13a);color:#111;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
.main {margin-left:216px;padding:76px 28px 40px}
.hero {position:relative;height:420px;border-radius:20px;overflow:hidden;margin-bottom:34px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.hero .bg {position:absolute;inset:0;background-size:cover;background-position:center}
.hero .bg::after {content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,transparent 60%),linear-gradient(0deg,var(--bg) 0%,transparent 45%)}
.hero .c {position:relative;z-index:2;padding:50px 46px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;max-width:600px}
.hero .tag {font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hero .tag::before {content:'';width:26px;height:1px;background:var(--accent)}
.hero h1 {font-size:42px;font-weight:900;line-height:1.08;margin-bottom:6px;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.hero .sub {font-size:14px;letter-spacing:2px;color:var(--txt2);margin-bottom:12px}
.hero .meta {display:flex;gap:8px;margin-bottom:14px}
.chip {padding:3px 12px;font-size:11.5px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip.gold {background:hsla(var(--ph),var(--ps),var(--pl),.16);border-color:var(--accent);color:var(--accent)}
.hero .desc {font-size:13.5px;line-height:1.7;color:var(--txt2);margin-bottom:20px;max-width:460px}
.hero .btns {display:flex;gap:12px}
.pbtn {padding:12px 32px;border:none;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#141414;box-shadow:0 6px 24px hsla(var(--ph),var(--ps),var(--pl),.35)}
.dbtn {padding:12px 26px;border-radius:999px;font-size:14px;cursor:pointer;background:transparent;color:var(--txt);border:1px solid var(--line)}
.hero .thumbs {position:absolute;right:30px;bottom:26px;display:flex;gap:8px;z-index:3}
.hero .thumb {width:92px;height:52px;border-radius:8px;background-size:cover;background-position:center;border:2px solid transparent;cursor:pointer;opacity:.6;transition:.2s}
.hero .thumb.on {border-color:var(--accent);opacity:1}
.sec {margin-bottom:32px}
.sec-h {display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-h h2 {font-size:16px;font-weight:700}
.sec-h .more {font-size:12px;color:var(--accent);cursor:pointer}
.row {display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.rcard {display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;min-width:290px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.2s}
.rcard:hover {transform:translateY(-3px);border-color:var(--accent)}
.rcard .t {width:104px;height:58px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0}
.rcard .i {flex:1;min-width:0}
.rcard .i .n {font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .i .s {font-size:11px;color:var(--txt2);margin-top:4px}
.rcard .pb {width:32px;height:32px;border-radius:50%;border:none;background:hsla(var(--ph),var(--ps),var(--pl),.16);color:var(--accent);font-size:12px;cursor:pointer}
.grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px}
.card {border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:var(--card);border:1px solid var(--line);transition:.22s}
.card:hover {transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.45);border-color:hsla(var(--ph),var(--ps),var(--pl),.45)}
.card .p {aspect-ratio:2/3;background-size:cover;background-position:center;position:relative}
.card .p::after {content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,hsla(var(--bg-h),var(--bg-s),var(--bg-l),.92))}
.card .nm {position:absolute;bottom:6px;left:10px;right:10px;font-size:12.5px;font-weight:600;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.card .yr {position:absolute;top:8px;right:8px;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);z-index:2}
.card .rt {position:absolute;top:8px;left:8px;font-size:11px;color:var(--accent);font-weight:700;z-index:2}
::-webkit-scrollbar {width:7px;height:7px} ::-webkit-scrollbar-thumb {background:hsla(var(--bg-h),var(--bg-s),80%,.2);border-radius:4px}
</style></head><body>
<div class="drawer"><div class="brand">VANVY<i>·CINEMA</i></div>
  <div class="nav-sec">浏览</div>
  NAV_HTML['noir']
  <div class="nav-sec">系统</div><div class="nav-it"><span class="ic">⚙</span>设置</div>
</div>
<div class="topbar">
  <div class="search"><input placeholder="搜索电影、剧集、演员..."></div>
  <div style="flex:1"></div><button class="hbtn">🔔</button><button class="hbtn">⚙</button><div class="avatar">M</div>
</div>
<div class="main">
  <div class="hero">
    <div class="bg" style="background-image:url('https://image.tmdb.org/t/p/w1280/kb4T9mU5pVYbVhFz3Kj0J8sYqW0.jpg')"></div>
    <div class="c">
      <div class="tag">推荐 · 本周主打</div>
      <h1>星际穿越</h1>
      <div class="sub">INTERSTELLAR · 2014</div>
      <div class="meta"><span class="chip gold">★ 9.4</span><span class="chip">科幻</span><span class="chip">冒险</span><span class="chip">4K · HDR</span></div>

      <div class="btns"><button class="pbtn">▶ 立即播放</button><button class="dbtn">详情</button></div>
    </div>
    <div class="thumbs">THUMB_HTML['noir']</div>
  </div>
  <div class="sec"><div class="sec-h"><h2>继续观看</h2><span class="more">更多 →</span></div>
    <div class="row">RCARD_HTML</div>
  </div>
  <div class="sec"><div class="sec-h"><h2>最近添加</h2><span class="more">更多 →</span></div>
    <div class="grid">CARD_HTML</div>
  </div>
</div>
</body></html>
