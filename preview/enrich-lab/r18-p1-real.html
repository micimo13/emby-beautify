<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>P1 实装</title>
<style>/* =============================================================================
   Vanvy Detail · vanvy-detail.css
   全部规则以 .vd- / body.vanvy-detail-active 作用域包裹，零全局污染。
   ============================================================================= */

body.vanvy-detail-active {
  --vd-line: rgba(255,255,255,.1);
  --vd-dim: #9aa0ad;
}
/* 主题强调色由 JS 写到 <html> 上；这里仅作末位兜底，绝不在 body 覆盖 */
:root {
  --vd-acc: #e8c66a;
  --vd-acc2: #a8741a;
  --vd-bg: #070608;
  /* 详情页「内容列」—— 主人 2026-09-12 定稿：
     留白版（不要拉到最宽）；从「剧照」往下所有容器必须共用这一列 */
  --vd-col-max: 1500px;
  --vd-col-pad: clamp(18px, 4vw, 56px);
}

/* ── 毛玻璃背景层 ─────────────────────────────────────────────── */
.vd-backdrop { position: relative; }
.vd-frost {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  backdrop-filter: blur(var(--vd-blur, 10px)) saturate(115%);
  -webkit-backdrop-filter: blur(var(--vd-blur, 10px)) saturate(115%);
  background: rgba(7,6,8, var(--vd-tint, .42));
  transition: backdrop-filter .4s, background .4s;
}

/* ── 第三方播放器 ─────────────────────────────────────────────── */
.vd-players { margin: 26px 0 10px; }
.vd-sec-label {
  display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 2.5px;
  color: var(--vd-dim); font-weight: 700; text-transform: uppercase; margin-bottom: 15px;
}
.vd-sec-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--vd-line), transparent); }

.vd-ptool { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.vd-tk {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer; color: #b9bec9;
  background: rgba(255,255,255,.05); border: 1px solid var(--vd-line); transition: .18s; user-select: none;
}
.vd-tk:hover { background: rgba(255,255,255,.12); color: #fff; }
.vd-tk.on { background: rgba(232,198,106,.16); border-color: rgba(232,198,106,.45); color: #f0d68c; }
.vd-tk .vd-d { width: 24px; height: 14px; border-radius: 8px; background: rgba(255,255,255,.18); position: relative; transition: .2s; }
.vd-tk .vd-d::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; transition: .2s; }
.vd-tk.on .vd-d { background: var(--vd-acc); }
.vd-tk.on .vd-d::after { left: 12px; }

.vd-prow { display: flex; gap: 12px; flex-wrap: wrap; }
.vd-pbtn {
  position: relative; display: inline-flex; align-items: center; gap: 9px; height: 44px;
  padding: 0 14px 0 9px; border-radius: 11px; font-size: 13px; font-weight: 600; cursor: pointer;
  color: #eef0f4; background: rgba(255,255,255,.06); border: 1px solid var(--vd-line);
  backdrop-filter: blur(10px); transition: .2s; white-space: nowrap;
}
.vd-pbtn:hover { background: rgba(255,255,255,.15); transform: translateY(-2px); }
.vd-pbtn:active { transform: translateY(0); }
.vd-pbtn.on { border-color: var(--vd-acc); box-shadow: 0 0 0 1px var(--vd-acc) inset, 0 8px 22px rgba(232,198,106,.16); }
.vd-pbtn .vd-ico {
  width: 27px; height: 27px; border-radius: 8px; flex: 0 0 auto;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  background-color: rgba(0,0,0,.32);
}
.vd-pbtn .vd-lastb {
  position: absolute; top: -7px; right: 7px; font-size: 9.5px; font-weight: 800; padding: 2px 6px;
  border-radius: 6px; background: linear-gradient(135deg, var(--vd-acc), var(--vd-acc2)); color: #1a1408;
}
.vd-prow.icononly .vd-pbtn { padding: 0 9px; gap: 0; }
.vd-prow.icononly .vd-pbtn .vd-nm { display: none; }
.vd-pnote { margin-top: 14px; font-size: 12px; color: var(--vd-dim); }
.vd-pnote b { color: #c9ced8; }

/* ── JAV 增强区 ───────────────────────────────────────────────── */
.vd-jav {
  margin: 30px 0 12px; padding: 26px 28px; border-radius: 18px;
  border: 1px solid rgba(232,198,106,.28);
  background: linear-gradient(135deg, rgba(232,198,106,.08), rgba(255,255,255,.03));
  backdrop-filter: blur(12px);
}
.vd-jav-hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.vd-jav-t { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--vd-acc); }
.vd-badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 7px;
  background: rgba(232,198,106,.16); border: 1px solid rgba(232,198,106,.4); color: #f0d68c; }
.vd-badge.dim { background: rgba(255,255,255,.08); border-color: var(--vd-line); color: #c9ced8; }

.vd-acts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
.vd-act { display: inline-flex; align-items: center; gap: 6px; height: 33px; padding: 0 12px; border-radius: 9px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; color: #dfe3ea;
  background: rgba(255,255,255,.07); border: 1px solid var(--vd-line); transition: .18s; }
.vd-act:hover { background: rgba(255,255,255,.16); color: #fff; }
.vd-act.gold { background: rgba(232,198,106,.16); border-color: rgba(232,198,106,.45); color: #f0d68c; }

.vd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px 24px; }
.vd-kv { display: flex; flex-direction: column; gap: 3px; }
.vd-kv .vd-k { font-size: 11.5px; color: var(--vd-dim); letter-spacing: 1px; }
.vd-kv .vd-v { font-size: 15px; font-weight: 600; color: #f0f2f5; }

.vd-subh { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--vd-dim); margin: 26px 0 13px; text-transform: uppercase; }
.vd-subh::after { content: ""; flex: 1; height: 1px; background: var(--vd-line); }
.vd-subh .vd-tip { font-weight: 500; letter-spacing: 0; text-transform: none; color: #6f7686; }

.vd-tags { display: flex; gap: 10px; flex-wrap: wrap; }
.vd-tag { font-size: 12.5px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
  background: rgba(255,255,255,.07); border: 1px solid var(--vd-line); color: #dfe3ea; transition: .18s; }
.vd-tag:hover { background: rgba(232,198,106,.16); border-color: rgba(232,198,106,.45); color: #f0d68c; }

.vd-actor { display: inline-flex; align-items: center; gap: 16px; padding: 14px 20px 14px 14px; border-radius: 13px;
  background: rgba(0,0,0,.34); border: 1px solid var(--vd-line); cursor: pointer; transition: .2s; }
.vd-actor:hover { border-color: var(--vd-acc); transform: translateY(-2px); }
.vd-actor .vd-av { width: 60px; height: 60px; border-radius: 11px; flex: 0 0 auto;
  background-size: cover; background-position: center; background-color: #1a1a22; }
.vd-actor .vd-anm { font-size: 16px; font-weight: 800; color: #f3f4f6; }
.vd-actor .vd-asub { font-size: 12px; color: var(--vd-dim); margin-top: 3px; }

.vd-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.vd-lnk { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 9px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; color: #cfd4dd; text-decoration: none;
  background: rgba(255,255,255,.05); border: 1px solid var(--vd-line); transition: .18s;
  white-space: nowrap; overflow: hidden; }
.vd-lnk:hover { background: rgba(232,198,106,.14); border-color: rgba(232,198,106,.4); color: #f0d68c; }
.vd-lnk .vd-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--vd-acc); flex: 0 0 auto; opacity: .85; }
.vd-lnk.mz .vd-dot { background: #7cd98a; }
.vd-lnk .vd-mz { font-size: 10px; color: #7cd98a; margin-left: 2px; }

/* ── Toast ───────────────────────────────────────────────────── */
#vd-toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 10px); z-index: 2147483000;
  background: rgba(20,20,28,.96); border: 1px solid rgba(232,198,106,.4); color: #f0d68c;
  padding: 11px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
  backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: .25s;
}
#vd-toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ── 主题化原生元素（低风险：只改色，不改布局）───────────────── */
body.vanvy-detail-active .itemView .mainDetailButtons .emby-button.raised,
body.vanvy-detail-active .itemView .mainDetailButtons button.raised {
  /* 保留原生样式，仅强调色微调（可关） */
}
body.vanvy-detail-active .itemView .detailButton.raised-backdropfilter { backdrop-filter: blur(8px); }

/* ── 响应式 ───────────────────────────────────────────────────── */
@media (max-width: 820px) {
  .vd-pbtn { height: 38px; padding: 0 10px 0 7px; font-size: 12px; gap: 7px; }
  .vd-pbtn .vd-ico { width: 23px; height: 23px; }
  .vd-jav { padding: 13px 14px; }
  .vd-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .vd-actor .vd-av { width: 50px; height: 50px; }
  .vd-links { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
}

/* ── 外链矩阵：可折叠（收起 = 完全隐藏，只留标题+一条线）────────── */
.vd-links.collapsed { display: none; }
.vd-links-toggle { margin-left: auto; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--vd-acc);
  letter-spacing: 0; text-transform: none; user-select: none; }
.vd-links-toggle:hover { opacity: .8; }
.vd-hint { color: #6f7686; font-size: 11px; }

/* ── 内容区（剧照 / 演员 / 预告片 / 作品 / 类似）───────────────
   内容列 = 留白版：max-width + 左右留白（主人要求「适当留白」，不要拉到最宽）
   从「剧照」往下所有容器（含 其它信息/genres/studios/links/媒体信息）都对齐到这一列 */
.vd-sections-host {
  margin-top: 20px;
  max-width: var(--vd-col-max);
  margin-left: auto; margin-right: auto;
  padding: 0 var(--vd-col-pad);
  box-sizing: border-box;
}
@media (max-width: 620px) { :root { --vd-col-pad: 12px; } }
.vd-injected-section { margin: 40px 0 10px; }

/* ── 演员 / 导演（圆形头像，对齐设计稿 .acard）── */
.vd-cast-section .vd-strip { gap: 20px; }
.vd-acard { display: block; flex: 0 0 auto; width: clamp(92px, 9vw, 132px); cursor: pointer; text-align: center; }
.vd-acard .vd-av { display: block; line-height: 0; width: 100%; aspect-ratio: 1 / 1; border-radius: 50%; overflow: hidden;
  border: 2px solid var(--vd-line); background: #14141d; transition: .25s; }
.vd-acard .vd-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vd-acard:hover .vd-av { border-color: var(--vd-acc); transform: scale(1.05); }
.vd-acard b { display: block; margin-top: 10px; font-size: 13px; font-weight: 600; color: #eef0f4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vd-acard em { font-style: normal; font-size: 11px; color: var(--vd-dim); display: block;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── 预告片（16:9 + 播放角标，对齐设计稿 .still）── */
.vd-tr-card { flex: 0 0 auto; width: clamp(200px, 20vw, 320px); aspect-ratio: 16 / 9; border-radius: 12px;
  overflow: hidden; position: relative; cursor: pointer; background: #14141d; box-shadow: 0 10px 28px rgba(0,0,0,.55); }
.vd-tr-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: .35s; }
.vd-tr-card:hover img { transform: scale(1.06); }
.vd-tr-card .vd-tr-badge { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; }
.vd-tr-card .vd-tr-badge i { width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.5);
  border: 2px solid rgba(255,255,255,.85); display: grid; place-items: center; transition: .22s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.vd-tr-card .vd-tr-badge i::after { content: ""; margin-left: 4px; border-style: solid; border-width: 10px 0 10px 17px;
  border-color: transparent transparent transparent #fff; }
.vd-tr-card:hover .vd-tr-badge i { background: var(--vd-acc); border-color: var(--vd-acc); transform: scale(1.08); }
.vd-tr-card .vd-tr-name { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 2; font-size: 13px;
  font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.9); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }

/* ── JAV 评价区（对齐设计稿 .revs）── */
.vd-revs { margin-top: 16px; border-top: 1px solid var(--vd-line); padding-top: 14px; }
.vd-rev { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,.08); }
.vd-rev:last-child { border-bottom: 0; }
.vd-rev .vd-rav { width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--vd-acc), var(--vd-acc2)); color: #1a1408; font-size: 12px; font-weight: 800; }
.vd-rev .vd-rbd { flex: 1; min-width: 0; }
.vd-rev .vd-rhd { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--vd-dim); margin-bottom: 4px; }
.vd-rev .vd-rsc { color: var(--vd-acc); font-weight: 800; letter-spacing: 1px; }
.vd-rev p { margin: 0; font-size: 13px; color: #dfe3ea; line-height: 1.6; }
.vd-rev .vd-rsub { font-size: 11.5px; color: var(--vd-dim); margin-top: 5px; }
.vd-rev-empty { font-size: 12.5px; color: var(--vd-dim); padding: 10px 0; }
.vd-rev-empty a { color: var(--vd-acc); text-decoration: none; }
.vd-h2 { font-size: 19px; font-weight: 700; color: #eef0f4; margin: 0 0 18px; display: flex; align-items: baseline; gap: 10px; }
.vd-h2 span { font-size: 12px; font-weight: 500; color: var(--vd-dim); }
.vd-h2 .vd-more { margin-left: auto; font-size: 12.5px; color: var(--vd-acc); cursor: pointer; }
.vd-strip { display: flex; gap: 16px; overflow-x: auto; padding: 6px 0 14px; scrollbar-width: none; }
.vd-strip::-webkit-scrollbar { display: none; }
.vd-still { flex: 0 0 auto; width: clamp(200px, 20vw, 320px); aspect-ratio: 16/9; border-radius: 10px; overflow: hidden;
  cursor: zoom-in; background: #14141d; box-shadow: 0 8px 22px rgba(0,0,0,.5); }
.vd-still img { width: 100%; height: 100%; object-fit: cover; transition: .35s; }
.vd-still:hover img { transform: scale(1.06); }
.vd-pcard { flex: 0 0 auto; width: clamp(112px, 10.5vw, 158px); cursor: pointer; }
.vd-pcard img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; background: #14141d;
  box-shadow: 0 8px 22px rgba(0,0,0,.5); transition: .25s; }
.vd-pcard:hover img { transform: translateY(-6px) scale(1.03); }
.vd-pcard i { display: block; margin-top: 7px; font-style: normal; font-size: 12px; color: #cfd4dd;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 移动端 */
@media (max-width: 820px) {
  .vd-still { width: 74vw; }
  .vd-pcard { width: 30vw; }
  .vd-links { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
}

/* =============================================================================
   VES v0.4 · Hero Takeover（详情页结构对齐设计稿）
   ============================================================================= */

/* ── 满屏固定背景层（full-bleed，置于应用内容之下）── */
.vd-hero-bg{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background-size:cover; background-position:center 22%; background-repeat:no-repeat;
  background-color:#0a0a0f;
  filter:blur(var(--vd-bg-blur, 6px)) saturate(108%);
  transform:scale(1.06); transform-origin:center;
  transition:filter .45s, background-image .5s;
}
.vd-hero-veil{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(0deg, var(--vd-bg,#070608) 0%, rgba(7,6,8,.9) 8%,
    rgba(7,6,8,.5) 26%, rgba(7,6,8,.16) 54%, rgba(7,6,8,.6) 100%);
  backdrop-filter:saturate(112%); -webkit-backdrop-filter:saturate(112%);
}

/* ── 应用内容抬到背景之上 ── */
body.vanvy-detail-active .itemView{ z-index:5; background:transparent !important; }
/* 防闪烁门控：美化未就绪前，直接隐藏 Emby 原生详情块（纯 CSS，无需 JS 赶时间）*/
body.vanvy-detail-active .itemView:not(.vd-ready) > .itemMainScrollSlider > .topDetailsContainer,
body.vanvy-detail-active .itemView:not(.vd-ready) > .itemMainScrollSlider > .details-additionalContent { visibility:hidden !important; }
.itemView.vd-ready > .itemMainScrollSlider > .topDetailsContainer,
.itemView.vd-ready > .itemMainScrollSlider > .details-additionalContent { visibility:visible; }
/* 防闪烁：详情页首帧先遮蔽，hero 就绪后淡入 */
.itemView{ transition:opacity .2s ease; }
.itemView.vd-pre{ opacity:0 !important; }
body.vanvy-detail-active .itemMainScrollSlider{ background:transparent !important; }
body.vanvy-detail-active .skinHeader{ z-index:50; }
body.vanvy-detail-active .backdropContainer{ display:none !important; }

/* ── 侧栏玻璃化（保留导航可用）── */
body.vanvy-detail-active .mainDrawer{
  background:transparent !important;
  backdrop-filter:blur(18px) saturate(125%);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
}
body.vanvy-detail-active .mainDrawer .scrollContainer,
body.vanvy-detail-active .mainDrawer .scrollSlider,
body.vanvy-detail-active .mainDrawer .mainDrawer-scrollContainer{ background:transparent !important; }

/* ── Hero 主体 ── */
.vd-hero{ position:relative; --vd-side:0px; }
.vd-hero-in{
  position:relative; max-width:1620px; margin:0 auto; box-sizing:border-box;
  --vd-hero-mintop:80px;
  min-height:calc(100svh - var(--vd-hero-mintop));
  padding:clamp(20px,4vh,48px) clamp(18px,4vw,56px) clamp(14px,2.4vh,28px);
  padding-left:calc(var(--vd-side,0px) + clamp(18px,4vw,56px));
  display:flex; flex-direction:column; justify-content:center; gap:clamp(16px,2.6vh,30px);
}
/* 首屏 = hero(标题/元数据/简介/CTA) + 第三方播放器行；其余容器下沉到下滑区 */
.vd-top{ display:flex; gap:clamp(26px,3.8vw,62px); align-items:flex-end; }
/* 无封面图（季/集）→ 方案 B：隐藏海报容器，信息满宽居中偏左，标题放大 */
body.vanvy-detail-active .vd-hero.vd-noposter .vd-poster{ display:none !important; }
body.vanvy-detail-active .vd-hero.vd-noposter .vd-top{ align-items:center; }
body.vanvy-detail-active .vd-hero.vd-noposter .vd-info{ max-width:900px; }
body.vanvy-detail-active .vd-hero.vd-noposter .vd-title{ font-size:clamp(32px,5.2vw,74px); max-width:26ch; }
body.vanvy-detail-active .vd-hero.vd-noposter .vd-hero-in{ justify-content:center; }
@media (max-width: 620px){
  body.vanvy-detail-active .vd-hero.vd-noposter .vd-top{ display:block; }
  body.vanvy-detail-active .vd-hero.vd-noposter .vd-title{ font-size:clamp(24px,7vw,34px); }
}
.vd-poster{ flex:0 0 auto; width:clamp(184px,18.6vw,330px); border-radius:20px; overflow:hidden;
  box-shadow:0 34px 84px rgba(0,0,0,.82); border:1px solid rgba(255,255,255,.15); background:#14141d; }
.vd-poster img{ width:100%; aspect-ratio:2/3; object-fit:cover; display:block; }
.vd-info{ flex:1 1 auto; min-width:0; padding-bottom:6px; }
/* 无背景图兜底：用主题色渐变代替空白 */
#vd-hero-bg.vd-hero-bg-plain{
  background-image:none !important;
  background:radial-gradient(1200px 700px at 20% -10%, rgba(232,198,106,.14), transparent 62%),
             radial-gradient(900px 560px at 100% 8%, rgba(168,116,26,.13), transparent 58%), #0a0910 !important;
  filter:none !important;
}
.vd-crumb{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--vd-acc,#e8c66a);
  letter-spacing:3px; font-weight:700; margin-bottom:14px; text-transform:uppercase; }
.vd-crumb::before{ content:""; width:28px; height:2px; background:var(--vd-acc,#e8c66a); border-radius:2px; }
.vd-title{ font-size:clamp(28px,4.2vw,60px); line-height:1.08; font-weight:800; letter-spacing:-.5px;
  color:#fff; margin:0; text-shadow:0 6px 34px rgba(0,0,0,.8); max-width:22ch; }
.vd-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px;
  font-size:14px; color:#f0f2f5; text-shadow:0 1px 3px rgba(0,0,0,1),0 3px 14px rgba(0,0,0,.95); }

/* ── 剧照大图查看器 Lightbox ────────────────────────────────── */

.vd-lightbox { position: fixed; inset: 0; z-index: 2147483002; background: rgba(5,5,9,.62);

/* =============================================================================
   VES v0.8 · 第四轮反馈
   ============================================================================= */

/* ── ① JAV 容器整体可收起 ─────────────────────────────────── */
.vd-jav-toggle { margin-left: auto; font-size: 11.5px; font-weight: 700; cursor: pointer;
  color: var(--vd-acc); letter-spacing: 0; user-select: none; }
.vd-jav-toggle:hover { opacity: .8; }
.vd-jav-body.hide { display: none; }
.vd-jav.vd-jav-collapsed { padding-bottom: 16px; }

/* ── ③ 内容渐入动画 ────────────────────────────────────────── */
@keyframes vdFadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.vd-hero-in > .vd-top,
.vd-hero-extra > .vd-players,
.vd-hero-extra > .vd-jav { animation: vdFadeUp .62s cubic-bezier(.22,.7,.24,1) both; }
.vd-hero-in > .vd-top { animation-delay: .04s; }
.vd-hero-extra > .vd-players { animation-delay: .16s; }
.vd-hero-extra > .vd-jav { animation-delay: .24s; }
.vd-injected-section { opacity: 0; transform: translateY(22px);
  animation: vdFadeUp .66s cubic-bezier(.22,.7,.24,1) both; }
.vd-injected-section:nth-child(1) { animation-delay: .30s; }
.vd-injected-section:nth-child(2) { animation-delay: .38s; }
.vd-injected-section:nth-child(3) { animation-delay: .46s; }
.vd-injected-section:nth-child(4) { animation-delay: .54s; }
.vd-injected-section:nth-child(5) { animation-delay: .62s; }
.vd-injected-section:nth-child(n+6) { animation-delay: .70s; }
/* 卡片内元素级联 */
.vd-strip > * { animation: vdFadeUp .5s cubic-bezier(.22,.7,.24,1) both; }
.vd-strip > *:nth-child(1){animation-delay:.04s} .vd-strip > *:nth-child(2){animation-delay:.08s}
.vd-strip > *:nth-child(3){animation-delay:.12s} .vd-strip > *:nth-child(4){animation-delay:.16s}
.vd-strip > *:nth-child(5){animation-delay:.20s} .vd-strip > *:nth-child(6){animation-delay:.24s}
.vd-strip > *:nth-child(n+7){animation-delay:.28s}
@media (prefers-reduced-motion: reduce) {

/* ── ④⑥ 容器内滚动（剧照 / 作品 / 推荐）───────────────────── */
.vd-strip { scroll-behavior: smooth; overscroll-behavior-x: contain; cursor: grab;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.22) transparent; }
.vd-strip.vd-dragging { cursor: grabbing; scroll-behavior: auto; user-select: none; }

.vd-strip::-webkit-scrollbar { height: 8px; }
.vd-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 8px; }
.vd-strip::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.34); }
.vd-strip::-webkit-scrollbar-track { background: transparent; }

/* 作品面板：高度自适应（不再固定 420px，页脚“查看全部”始终可见） */

.vd-aworks-strip { flex-wrap: nowrap; }
.vd-jcard { position: relative; width: clamp(196px, 19vw, 284px) !important; }
.vd-jcard img { aspect-ratio: 16 / 10; object-fit: cover; width: 100%; display: block;
  background: #14141d; border-radius: 10px; }
.vd-jcard i { font-size: 11px; letter-spacing: .5px; }

/* ── ⑤ 信息面板重设计 ────────────────────────────────────── */
/* aboutSection 是「外层包裹容器」（内部装 genres/studios/links/媒体信息 等）。
   主人 2026-09-12 定稿：它与「剧照」以下所有容器宽度**完全一致**。
   → 卡片本身宽度 = 内容列（100% - 2×留白，居中，并受 --vd-col-max 限制）
     卡片左右边缘 == 注入区内容列左右边缘 → 视觉完全对齐。 */
body.vanvy-detail-active .vd-p2-about {
  box-sizing: border-box;
  width: calc(100% - 2 * var(--vd-col-pad));
  max-width: calc(var(--vd-col-max) - 2 * var(--vd-col-pad));
  margin: 14px auto 0;
  padding: 16px 18px;
  background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09);
  border-radius: 14px;
}
/* 媒体信息是 about 的**子级**：负 margin 抵消父级内边距 → 与外层卡片同宽 */
body.vanvy-detail-active .vd-p2-media {
  box-sizing: border-box;
  background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09);
  border-radius: 14px; padding: 16px 18px; margin: 14px -18px 0;
}
/* about 之外的其它原生容器（所属合集/更多类似/章节…）→ 也收进同一内容列：
   直接用内容列宽 + 同一左右留白（覆盖 Emby 自带的 43px padded-left）。 */
body.vanvy-detail-active .details-additionalContent > .verticalSection:not(.vd-p2-about) {
  box-sizing: border-box;
  max-width: var(--vd-col-max);
  margin-left: auto; margin-right: auto;
  padding-left: var(--vd-col-pad);
  padding-right: var(--vd-col-pad);
}
body.vanvy-detail-active .vd-p2-about h4,
body.vanvy-detail-active .vd-p2-media h4 { color: var(--vd-acc); font-size: 12px; letter-spacing: 1.4px;
  text-transform: uppercase; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
body.vanvy-detail-active .vd-p2-media .mediaSources { margin-top: 8px; }
.vd-mi-open {
  margin-left: auto; font-size: 11.5px; padding: 4px 11px; border-radius: 999px;
  border: 1px solid rgba(232,198,106,.4); background: rgba(232,198,106,.1); color: #f0dca6;
  cursor: pointer; font-family: inherit; font-weight: 600; transition: .16s; letter-spacing: 0; text-transform: none;
}
.vd-mi-open:hover { background: rgba(232,198,106,.22); }

}

/* ── ⑤ 完整媒体信息弹框 ─────────────────────────────────── */
.vd-mi-modal { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 22px; }
.vd-mi-mask { position: absolute; inset: 0; background: rgba(4,4,7,.7); backdrop-filter: blur(14px) saturate(125%); -webkit-backdrop-filter: blur(14px) saturate(125%); }
.vd-mi-box {
  position: relative; width: min(900px, 95vw); max-height: 88vh; display: flex; flex-direction: column;
  background: rgba(23,22,30,.7); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; overflow: hidden;
  backdrop-filter: blur(26px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(140%);
  box-shadow: 0 34px 90px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.08);

}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {

}
@keyframes vdMiIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.vd-mi-hd { display: flex; align-items: flex-start; gap: 14px; padding: 19px 22px 15px; border-bottom: 1px solid rgba(255,255,255,.09); }

  padding: 1px 0 0; line-height: 1; text-align: center;   /* 1px 光学校正：U+2715 的字形重心偏上 */

/* ── ⑤ 媒体信息卡片（数据驱动）────────────────────────── */
.vd-mi-native-hide { display: none !important; }
/* 弹框底部（主题化按钮，修复「复制全部」风格不一致）*/
.vd-mi-ft { display: flex; align-items: center; gap: 12px; padding: 13px 22px;
  border-top: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.02); }
.vd-mi-ft > span { font-size: 11.5px; color: rgba(255,255,255,.42); }
.vd-mi-copy {
  margin-left: auto; font-size: 12px; padding: 7px 14px; border-radius: 999px;
  border: 1px solid rgba(232,198,106,.4); background: rgba(232,198,106,.1); color: #f0dca6;
  cursor: pointer; font-family: inherit; font-weight: 600; transition: .16s; white-space: nowrap;
}
.vd-mi-copy:hover { background: rgba(232,198,106,.22); }
.vd-mi-copy:active { transform: translateY(1px); }
.vd-micard { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
.vd-mistats { display: flex; flex-wrap: wrap; gap: 10px; }
.vd-mistats > div { flex: 1 1 120px; min-width: 108px; background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.08); border-radius: 11px; padding: 10px 13px;
  display: flex; flex-direction: column; gap: 5px; }
.vd-mistats b { font-size: 15.5px; color: #eef0f4; font-weight: 700; }
.vd-mistats span { font-size: 11px; color: rgba(255,255,255,.45); letter-spacing: .6px; }
.vd-pathbox { display: flex; align-items: center; gap: 10px; background: #0d0c11;
  border: 1px dashed rgba(255,255,255,.12); border-radius: 11px; padding: 10px 13px; }
.vd-pb-k { font-size: 11.5px; color: rgba(255,255,255,.4); flex: 0 0 auto; }
.vd-pb-v { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #cfd4e0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vd-pb-v.hide { filter: blur(4.5px); user-select: none; }
.vd-pb-eye, .vd-pb-cp { font-size: 11.5px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.05); color: rgba(255,255,255,.66);
  font-family: inherit; flex: 0 0 auto; }
.vd-pb-eye:hover, .vd-pb-cp:hover { color: #fff; background: rgba(255,255,255,.11); }
.vd-miact { display: flex; align-items: center; gap: 12px; }
.vd-mihint { font-size: 11.5px; color: rgba(255,255,255,.4); }

/* 媒体流分组 grid（弹框内） */
.vd-misec { display: flex; flex-direction: column; gap: 10px; }
.vd-misec > h5 { font-size: 11.5px; color: var(--vd-acc); letter-spacing: 1.4px; text-transform: uppercase;
  display: flex; align-items: center; gap: 8px; }
.vd-misec > h5 em { font-style: normal; font-size: 10px; padding: 1px 7px; border-radius: 5px;
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.5); letter-spacing: 0; }
.vd-migrp { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
.vd-migrp > h5 { font-size: 12px; color: #dfe3ec; display: flex; align-items: center; gap: 8px; }
.vd-migrp > h5 em { font-style: normal; font-size: 10px; padding: 1px 7px; border-radius: 5px;
  background: rgba(232,198,106,.14); color: #f0dca6; }
.vd-migrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2px 16px;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 11px; padding: 10px 12px; }
.vd-mikv { display: flex; gap: 10px; font-size: 12.5px; padding: 4px 0; align-items: baseline; }
.vd-mikv > span { color: rgba(255,255,255,.45); flex: 0 0 78px; }
.vd-mikv > i { font-style: normal; color: #eef0f4; flex: 1; word-break: break-all; }
.vd-mikv.wide { padding: 6px 0; }
.vd-mistream { grid-column: 1 / -1; font-size: 11px; color: var(--vd-acc); letter-spacing: 1px;
  border-top: 1px dashed rgba(255,255,255,.1); padding-top: 7px; margin-top: 3px; }
@media (max-width: 620px) {
  .vd-migrid { grid-template-columns: 1fr; }
  .vd-mistats > div { flex: 1 1 44%; }
  .vd-pathbox { flex-wrap: wrap; }
  .vd-pb-v { flex: 1 1 100%; order: 3; }
}

/* ── ⑨ MDC-NG 刮削按钮 ──────────────────────────────────── */
.vd-mdc-host { display: flex; align-items: center; gap: 9px; margin: 12px 0 2px; flex-wrap: wrap; }
.vd-mdc-btn, .vd-mdc-cfg {
  display: inline-flex; align-items: center; gap: 7px; font-family: inherit; cursor: pointer;
  border-radius: 10px; font-weight: 600; transition: .16s; white-space: nowrap;
}
.vd-mdc-btn {
  font-size: 13.5px; padding: 9px 16px;
  border: 1px solid rgba(232,198,106,.5); background: rgba(232,198,106,.14); color: #f4e3b4;
}
.vd-mdc-btn:hover:not(:disabled) { background: rgba(232,198,106,.26); border-color: rgba(232,198,106,.75); }
.vd-mdc-btn:disabled { opacity: .7; cursor: default; }
.vd-mdc-ico { font-size: 15px; }
.vd-mdc-cfg {
  font-size: 12.5px; padding: 9px 13px; border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.05); color: rgba(255,255,255,.72);
}
.vd-mdc-cfg:hover { background: rgba(255,255,255,.11); color: #fff; }
@media (max-width: 620px) {
  .vd-mdc-btn, .vd-mdc-cfg { font-size: 12.5px; padding: 8px 13px; }
}

/* ── 媒体信息：版本切换器 ───────────────────────────────── */
.vd-misrc { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.vd-misrc > span { font-size: 11px; color: rgba(255,255,255,.45); letter-spacing: .6px; }
.vd-misrc > em { font-style: normal; font-size: 12px; color: var(--vd-acc); }
.vd-misrc-sel {
  box-sizing: border-box !important; height: auto !important; min-height: 32px !important;
  background: rgba(255,255,255,.05) !important; border: 1px solid rgba(255,255,255,.14) !important;
  border-radius: 9px !important; color: #eef0f4 !important; padding: 6px 10px !important;
  font-size: 12.5px !important; font-family: inherit; max-width: 380px;
}
.vd-misrc-sel:focus { border-color: var(--vd-acc) !important; outline: none; }
.vd-misrc-sel option { color: #111; background: #fff; }
.vd-mi-hd .vd-misrc { margin-top: 8px; }
@media (max-width: 620px) { .vd-misrc-sel { max-width: 100%; } }

.vd-mi-empty { font-size: 12.5px; color: rgba(255,255,255,.5); line-height: 1.8;
  background: rgba(255,255,255,.03); border: 1px dashed rgba(255,255,255,.12);
  border-radius: 11px; padding: 12px 14px; }

/* ── 播放器页顶栏：透明（videoOsdHeader 专用，满屏视频上不该有底色）── */
body .skinHeader.videoOsdHeader,
body .skinHeader.skinHeader-withBackground.videoOsdHeader,
body .skinHeader.headerTop.videoOsdHeader {
  background: transparent !important;
  background-color: transparent !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  border-bottom-color: transparent !important;
  box-shadow: none !important;
}
body .skinHeader.videoOsdHeader::before,
body .skinHeader.videoOsdHeader::after { background: transparent !important; content: none !important; }
/* 顶栏内部各层同样透明，避免“两条颜色” */
body .skinHeader.videoOsdHeader > *,
body .skinHeader.videoOsdHeader .headerLeft,
body .skinHeader.videoOsdHeader .headerMiddle,
body .skinHeader.videoOsdHeader .headerRight,
body .skinHeader.videoOsdHeader .headerSection { background: transparent !important; box-shadow: none !important; }
