# VES 图片代理前缀（示例：nginx 反代到本机 imgproxy）
# 用法: /vdimg/i?u=<urlencoded>  ->  http://192.168.1.10:18098/i?u=...
# 作用: 用你自己的公网 HTTPS 域名转发 JavDB / YouTube 等被墙图床
#
# 部署时把下面的 IP 换成你自己的：
#   把下面 IP 换成运行 imgproxy 的机器（本仓库默认：飞牛 192.168.1.10）
#   并把本 server 块放进你已有的 HTTPS server（或用 certbot 配好证书）
location /vdimg/ {
    proxy_pass http://<图片代理主机>:18098/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=604800" always;
}
