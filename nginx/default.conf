server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}

    # VES 图片代理前缀 -> 飞牛 img_proxy:18098（供公网 HTTPS 分发被墙图床）
        location /vdimg/ {
        proxy_pass http://<图片代理主机>:18098/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        # ⚠️ 不要在此再加 ACAO：上游 img_proxy 服务本身已返回
        #   Access-Control-Allow-Origin: *（并处理 OPTIONS 预检）。
        #   两处都加会变成「重复头」→ 浏览器直接拒绝（实测 /tmdb 通道被拦）。
    }

    # ── VES 资料增强服务反代（第三方资料：剧照/演员/预告/同类）────────
    # 上游 Python 服务自带 CORS（含 OPTIONS 预检），此处不再 add_header，
    # 否则会与上游的 Access-Control-Allow-Origin 重复（浏览器会拒）。
    location /enrich/ {
        proxy_pass http://192.168.1.10:18097/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 40s;
    }
    # ── AVDB 引擎反代（供外网访问；内网直连优先，失败自动回退到本域名）────
    # 上游自带 CORS（实测 OPTIONS 回显 Origin 且允许 x-api-key），此处不重复 add_header。
    location /avdb/ {
        proxy_pass http://192.168.1.10:38000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
